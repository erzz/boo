<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" fill="none">
  <!-- boo brand mark -->
  <!-- Concept: papa Ghostty (taller-than-wide, modelled on Ghostty's logo) with
       three baby boos peeking up through papa's wavy hem. The babies' faces
       spell out the word "boo":
         Baby 1 = "b" (composite face: stem + bowl)
         Baby 2 = "oo" (two ring eyes — one o per eye, completing the word)
         Baby 3 = personality (different eye style, not part of spelling). -->

  <defs>
    <style>
      .papa {
        stroke: #5B5BD6;
        stroke-width: 9;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: #ffffff;
      }
      .baby {
        stroke: #1a1a1a;
        stroke-width: 5;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: #ffffff;
      }
      .face-fill   { fill: #1a1a1a; stroke: none; }
      .face-stroke { stroke: #1a1a1a; stroke-width: 5; stroke-linecap: round; fill: none; }
      .prompt {
        stroke: #1a1a1a;
        stroke-width: 9;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Papa Ghostty: rounded top, 5-bump wavy bottom hem -->
  <path class="papa"
        d="M 45 100
           Q 45 30, 140 30
           Q 235 30, 235 100
           L 235 215
           Q 226 224, 217 215
           Q 208 206, 199 215
           Q 190 224, 181 215
           Q 172 206, 163 215
           Q 154 224, 145 215
           Q 136 206, 127 215
           Q 118 224, 109 215
           Q 100 206, 91 215
           Q 82 224, 73 215
           Q 64 206, 55 215
           Q 50 220, 45 215
           Z" />

  <!-- Prompt > on papa's face (centred horizontally, upper third vertically) -->
  <polyline class="prompt" points="88,75 132,105 88,135" />
  <line class="prompt" x1="148" y1="142" x2="192" y2="142" />

  <!-- Baby 1 — "b": stem + bowl as ONE composite face. Bowl pulled close
       to the stem so it reads as a single letter rather than two features. -->
  <g transform="translate(48 180)">
    <path class="baby"
          d="M 0 30 Q 0 0, 27 0 Q 55 0, 55 30 L 55 75
             Q 46 67, 37 75 Q 28 83, 19 75 Q 9 67, 0 75 Z" />
    <!-- stem (taller, anchors the b) -->
    <line stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"
          x1="20" y1="28" x2="20" y2="50" />
    <!-- bowl (sits flush against the stem, closer than before) -->
    <circle class="face-stroke" cx="29" cy="44" r="7" />
  </g>

  <!-- Baby 2 — "oo": two ring eyes, one o per eye. Together they complete
       the word "boo". Spaced like normal eyes so the baby still reads as
       a face, not just two letters floating. -->
  <g transform="translate(112 185)">
    <path class="baby"
          d="M 0 30 Q 0 0, 27 0 Q 55 0, 55 30 L 55 75
             Q 46 67, 37 75 Q 28 83, 19 75 Q 9 67, 0 75 Z" />
    <circle class="face-stroke" cx="18" cy="38" r="6" />
    <circle class="face-stroke" cx="37" cy="38" r="6" />
  </g>

  <!-- Baby 3 — personality: not part of spelling. Different eye style to
       give him his own character. Going with sleepy/dopey: two short
       downward curves like he just yawned. -->
  <g transform="translate(176 180)">
    <path class="baby"
          d="M 0 30 Q 0 0, 27 0 Q 55 0, 55 30 L 55 75
             Q 46 67, 37 75 Q 28 83, 19 75 Q 9 67, 0 75 Z" />
    <path class="face-stroke" d="M 12 38 Q 18 32, 24 38" />
    <path class="face-stroke" d="M 31 38 Q 37 32, 43 38" />
  </g>
</svg>
