name: Release

# Manual-only. Cutting a release is a deliberate act, not a side effect of
# merging to main. Trigger from the Actions tab ("Run workflow") when you're
# ready to ship whatever has accumulated on main since the last tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits
        env:
          # MUST be a PAT, not the default GITHUB_TOKEN. Tags pushed using
          # GITHUB_TOKEN do not trigger downstream workflows (GitHub safeguard
          # against recursive CI), which would mean goreleaser.yml never runs
          # and the Homebrew formula never updates. See docs/RELEASING.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
